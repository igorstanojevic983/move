name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build WebView verzija
        run: |
          gradle -p . assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MoveTV.apk

      - name: Build Firefox (GeckoView) verzija
        run: |
          gradle -p firefox assembleRelease --no-daemon --stacktrace
          cp firefox/app/build/outputs/apk/release/app-release.apk MoveTV-Firefox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MoveTV-apk
          path: |
            MoveTV.apk
            MoveTV-Firefox.apk

      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MoveTV – najnovija verzija
          files: |
            MoveTV.apk
            MoveTV-Firefox.apk
          make_latest: true
