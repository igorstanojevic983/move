plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'rs.webtv.gecko'
    compileSdk 36

    defaultConfig {
        applicationId 'rs.webtv.gecko'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "2.0.${runNumber}"
        ndk {
            // X96 Max+ koristi 32-bitni ARM
            abiFilters 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            storeFile file('../../app/webtv.jks')
            storePassword 'webtv123'
            keyAlias 'webtv'
            keyPassword 'webtv123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:[144.0, 150.0)'
}
